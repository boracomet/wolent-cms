services:
  wolent:
    build:
      context: .
      dockerfile: Dockerfile.production
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=file:/app/data/wolent.db
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - COOKIE_SECRET=${COOKIE_SECRET:-change_me_in_production_minimum_32_chars_long}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:-change_me_in_production_minimum_32_chars_long}
      - CORS_ORIGINS=https://wolent.com,http://wolent.com
      - UPLOAD_PROVIDER=local
      - UPLOAD_DIR=/app/public/uploads
    volumes:
      - wolent_data:/app/data
      - wolent_uploads:/app/public/uploads
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  wolent_data:
  wolent_uploads:
